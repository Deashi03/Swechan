name: CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:index -- --check
      - run: npm run catalog:validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  e2e:
    # Reproducible end-to-end run (Chromium with iPhone emulation). Not a deploy gate:
    # the deploy depends only on the test job, so a flaky browser run never blocks a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g playwright@1.63.0
      - run: playwright install --with-deps chromium
      - run: npm run build
      - run: NODE_PATH="$(npm root -g)" npm run e2e

  deploy:
    # Requires: repository Settings → Pages → Source = "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
